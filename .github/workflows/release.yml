name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also upload to Thunderstore'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # A tag that disagrees with the source would ship a package whose version
      # does not match the plugin inside it, and Thunderstore versions can never
      # be reused or withdrawn. Fail before building rather than after uploading.
      - name: Check the tag agrees with the source
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $tag) { $tag = (Get-Content package/manifest.json | ConvertFrom-Json).version_number }

          $plugin = (Select-String -Path src/NearbyPanel.Plugin/PluginInfo.cs -Pattern 'Version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $manifest = (Get-Content package/manifest.json -Raw | ConvertFrom-Json).version_number

          "tag: $tag | PluginInfo: $plugin | manifest: $manifest"
          if ($plugin -ne $manifest) { throw "PluginInfo.cs and manifest.json disagree" }
          if ($tag -ne $plugin) { throw "tag $tag does not match version $plugin" }

          "VERSION=$plugin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        env:
          NEARBYPANEL_ALLOW_MISSING_GAME: '1'
        run: dotnet test tests/NearbyPanel.Tests/NearbyPanel.Tests.csproj -c Release --nologo --verbosity minimal

      # No Valheim on a runner, so this builds against published reference
      # assemblies. Their file names carry a -publicized suffix but the assembly
      # identity inside is unchanged, so the output binds to the real game
      # assemblies at runtime exactly as a local build does.
      - name: Build
        run: dotnet build src/NearbyPanel.Plugin/NearbyPanel.Plugin.csproj -c Release --nologo -p:UseNuGetGameRefs=true

      - name: Assemble the package
        shell: pwsh
        run: |
          $stage = "build/out/stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $files = @(
            "src/NearbyPanel.Plugin/bin/Release/NearbyPanel.dll",
            "src/NearbyPanel.Plugin/bin/Release/NearbyPanel.Core.dll",
            "package/manifest.json",
            "package/icon.png",
            "package/README.md",
            "package/CHANGELOG.md"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "missing $file" }
            Copy-Item $file $stage -Force
          }

          $zip = "build/out/NearbyPanel-$env:VERSION.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          # Reopen and count, because a partial archive is written silently when
          # a file is locked mid-compression.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $present = $archive.Entries.Count
            if ($present -ne $files.Count) { throw "zip has $present entries, expected $($files.Count)" }
            $archive.Entries | ForEach-Object { "  $($_.FullName)" }
          } finally { $archive.Dispose() }

          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same archive a mod manager installs, attached for anyone who
          # installs by hand.
          gh release create "${{ github.ref_name }}" "$ZIP" \
            --title "NearbyPanel $VERSION" \
            --notes-file package/CHANGELOG.md \
            --verify-tag

      # Skipped unless the token is configured, so a tag never fails for want of
      # a secret. A published version cannot be replaced or deleted, so this step
      # deliberately runs last, after everything else has succeeded.
      - name: Publish to Thunderstore
        if: env.THUNDERSTORE_TOKEN != ''
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        shell: bash
        run: |
          dotnet tool install -g tcli
          tcli publish \
            --file "$ZIP" \
            --token "$THUNDERSTORE_TOKEN" \
            --package-namespace I3_rett \
            --package-name NearbyPanel \
            --package-version "$VERSION" \
            --repository https://thunderstore.io

      - uses: actions/upload-artifact@v4
        with:
          name: NearbyPanel-${{ env.VERSION }}
          path: ${{ env.ZIP }}
